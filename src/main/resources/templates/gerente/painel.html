<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Painel administrativo | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><div class="admin-shell"><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente}">Painel</a><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/gerente/usuarios}">Usuários</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Visão geral da operação</p><h1>Painel administrativo</h1></div></div><section class="stats"><div class="stat"><strong th:text="${quantidadeProdutos}">0</strong><span>Produtos</span></div><div class="stat"><strong th:text="${quantidadePedidos}">0</strong><span>Pedidos</span></div><div class="stat"><strong th:text="${quantidadeUsuarios}">0</strong><span>Usuários</span></div><div class="stat"><strong th:text="${#lists.size(produtosEstoqueBaixo)}">0</strong><span>Estoque baixo</span></div></section><section class="grid"><article class="panel"><h2>Estoque baixo</h2><ul class="list"><li th:each="produto : ${produtosEstoqueBaixo}" th:text="${produto.nome + ' - ' + produto.estoqueAtual + ' un.'}">Produto</li><li th:if="${#lists.isEmpty(produtosEstoqueBaixo)}">Nenhum produto precisa de reposição.</li></ul></article><article class="panel"><h2>Perdas registradas</h2><p class="muted" th:if="${#lists.isEmpty(perdas)}">Nenhuma perda registrada.</p><ul class="list"><li th:each="perda : ${perdas}" th:text="${perda.produto.nome + ' - ' + perda.quantidade + ' un.'}">Movimentação</li></ul></article></section></main></div></body></html>
