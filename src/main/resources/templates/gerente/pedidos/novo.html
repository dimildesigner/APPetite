<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Novo pedido | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Atendimento</p><h1>Novo pedido</h1></div></div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><form class="panel form-grid" method="post" th:action="@{/gerente/pedidos/novo}"><label>Usuário<select name="usuarioId" required><option value="">Selecione</option><option th:each="usuario : ${usuarios}" th:value="${usuario.id}" th:text="${usuario.nome + ' - ' + usuario.email}">Usuário</option></select></label><label>Tipo<select name="tipoPedido" required><option th:each="tipo : ${tiposPedido}" th:value="${tipo}" th:text="${tipo.descricao}">Tipo</option></select></label><label>Horário de retirada<input type="datetime-local" name="horarioRetirada"></label><label class="full">Observação<textarea name="observacao" maxlength="500"></textarea></label><div class="form-actions full"><button class="button" type="submit">Criar pedido</button><a class="button secondary" th:href="@{/gerente/pedidos}">Cancelar</a></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></main></body></html>
