<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pedidos | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente}">Painel</a><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Atendimento</p><h1>Pedidos</h1></div><a class="button" th:href="@{/gerente/pedidos/novo}">+ Novo pedido</a></div><div class="flash" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><form class="filters" method="get" th:action="@{/gerente/pedidos}"><select name="status"><option value="">Todos os status</option><option th:each="item : ${statusList}" th:value="${item}" th:text="${item.descricao}" th:selected="${item == filtroStatus}">Status</option></select><select name="tipoPedido"><option value="">Todos os tipos</option><option th:each="item : ${tiposPedido}" th:value="${item}" th:text="${item.descricao}" th:selected="${item == filtroTipo}">Tipo</option></select><button class="button" type="submit">Filtrar</button></form><div class="table-wrap"><table><thead><tr><th>#</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td th:text="${pedido.id}">1</td><td th:text="${pedido.usuario.nome}">Cliente</td><td th:text="${pedido.tipoPedido.descricao}">Tipo</td><td th:text="${'R$ ' + pedido.valorTotal}">R$ 0,00</td><td><span class="badge" th:classappend="${pedido.status.name() == 'CANCELADO' ? ' danger' : (pedido.status.name() == 'AGUARDANDO_PAGAMENTO' ? ' warn' : '')}" th:text="${pedido.status.descricao}">Status</span></td><td><div class="actions"><a class="button secondary" th:href="@{/gerente/pedidos/{id}/editar(id=${pedido.id})}">Abrir</a><form class="inline" method="post" th:if="${pedido.status.name() == 'AGUARDANDO_PAGAMENTO'}" th:action="@{/gerente/pedidos/{id}/cancelar(id=${pedido.id})}"><button class="button danger" type="submit">Cancelar</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></div></td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6">Nenhum pedido encontrado.</td></tr></tbody></table></div></main></body></html>
