<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Editar pedido | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted" th:text="${'Pedido #' + pedido.id}">Pedido</p><h1 th:text="${pedido.usuario.nome}">Pedido</h1></div><a class="button secondary" th:href="@{/gerente/pedidos}">Voltar</a></div><div class="flash" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><section class="grid"><article class="panel"><h2>Adicionar item</h2><form class="form-grid" method="post" th:action="@{/gerente/pedidos/{id}/itens(id=${pedido.id})}"><label class="full">Produto<select name="produtoId" required><option value="">Selecione</option><option th:each="produto : ${produtos}" th:value="${produto.id}" th:text="${produto.nome + ' - estoque: ' + produto.estoqueAtual}">Produto</option></select></label><label>Quantidade<input name="quantidade" type="number" min="1" required></label><div class="form-actions"><button class="button" type="submit">Adicionar</button></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></article><article class="panel"><h2>Resumo</h2><p><strong>Status:</strong> <span class="badge" th:text="${pedido.status.descricao}">Status</span></p><p><strong>Tipo:</strong> <span th:text="${pedido.tipoPedido.descricao}">Tipo</span></p><p><strong>Total:</strong> <span th:text="${'R$ ' + pedido.valorTotal}">R$ 0,00</span></p><form method="post" th:if="${pedido.status.name() == 'AGUARDANDO_PAGAMENTO'}" th:action="@{/gerente/pedidos/{id}/cancelar(id=${pedido.id})}"><button class="button danger" type="submit">Cancelar pedido</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></article></section><section class="panel"><h2>Itens do pedido</h2><p class="muted" th:if="${#lists.isEmpty(pedido.itens)}">Nenhum item adicionado.</p><div class="item-row" th:each="item : ${pedido.itens}"><div><strong th:text="${item.produto.nome}">Produto</strong><br><span class="muted" th:text="${'Subtotal: R$ ' + item.subtotal}">Subtotal</span></div><form method="post" th:action="@{/gerente/pedidos/{id}/itens/{itemId}/quantidade(id=${pedido.id},itemId=${item.id})}"><input name="quantidade" type="number" min="1" th:value="${item.quantidade}" required><button class="button secondary" type="submit">Salvar</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form><form method="post" th:action="@{/gerente/pedidos/{id}/itens/{itemId}/remover(id=${pedido.id},itemId=${item.id})}"><button class="button danger" type="submit">Remover</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></div></section></main></body></html>
