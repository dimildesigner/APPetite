<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head>
<body><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente}">Painel</a><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Catálogo e disponibilidade</p><h1>Produtos</h1></div><a class="button" th:href="@{/gerente/produtos/novo}">+ Novo produto</a></div><div class="flash" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><div class="table-wrap"><table><thead><tr><th>Produto</th><th>Categoria</th><th>Venda</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead><tbody><tr th:each="produto : ${produtos}"><td><strong th:text="${produto.nome}">Produto</strong><br><span class="muted" th:text="${produto.descricao}">Descrição</span></td><td th:text="${produto.categoria.descricao}">Categoria</td><td th:text="${'R$ ' + produto.precoVenda}">R$ 0,00</td><td th:text="${produto.estoqueAtual}">0</td><td><span class="badge" th:classappend="${!produto.ativo ? ' danger' : ''}" th:text="${produto.ativo ? 'Ativo' : 'Inativo'}">Ativo</span></td><td><div class="actions"><a class="button secondary" th:href="@{/gerente/produtos/{id}/editar(id=${produto.id})}">Editar</a><a class="button secondary" th:href="@{/gerente/estoque/{id}(id=${produto.id})}">Estoque</a><form class="inline" method="post" th:action="@{/gerente/produtos/{id}/status(id=${produto.id})}"><input type="hidden" name="ativo" th:value="${!produto.ativo}"><button class="button danger" type="submit" th:text="${produto.ativo ? 'Desativar' : 'Ativar'}">Desativar</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></div></td></tr><tr th:if="${#lists.isEmpty(produtos)}"><td colspan="6">Nenhum produto cadastrado.</td></tr></tbody></table></div></main></body></html>
