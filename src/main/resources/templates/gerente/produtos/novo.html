<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Novo produto | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/gerente}">APPetite / Gestão</a><nav class="admin-nav"><a th:href="@{/gerente/produtos}">Produtos</a><a th:href="@{/gerente/pedidos}">Pedidos</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Catálogo</p><h1>Novo produto</h1></div></div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><form class="panel form-grid" method="post" th:action="@{/gerente/produtos/novo}" th:object="${produto}"><label>Nome<input th:field="*{nome}" required minlength="2" maxlength="100"><small class="muted" th:errors="*{nome}"></small></label><label>Categoria<select th:field="*{categoria}" required><option value="">Selecione</option><option th:each="categoria : ${categorias}" th:value="${categoria}" th:text="${categoria.descricao}">Categoria</option></select></label><label class="full">Descrição<textarea th:field="*{descricao}" maxlength="500"></textarea></label><label>Preço de custo<input type="number" step="0.01" min="0" th:field="*{precoCusto}" required></label><label>Preço de venda<input type="number" step="0.01" min="0.01" th:field="*{precoVenda}" required></label><label>Estoque mínimo<input type="number" min="0" th:field="*{estoqueMinimo}" required></label><label>Produto perecível<select th:field="*{perecivel}"><option value="false">Não</option><option value="true">Sim</option></select></label><div class="form-actions full"><button class="button" type="submit">Cadastrar produto</button><a class="button secondary" th:href="@{/gerente/produtos}">Cancelar</a></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></main></body></html>
