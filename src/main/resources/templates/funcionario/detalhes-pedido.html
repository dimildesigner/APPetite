<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalhe do pedido | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/funcionario}">APPetite / Operação</a><nav class="admin-nav"><a th:href="@{/funcionario}">Pedidos</a><a th:href="@{/funcionario/verificar}">Verificar retirada</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted" th:text="${'Pedido #' + pedido.id}">Pedido</p><h1 th:text="${pedido.usuario.nome}">Cliente</h1></div><a class="button secondary" th:href="@{/funcionario}">Voltar</a></div><div class="flash" th:if="${sucesso}" th:text="${sucesso}">Sucesso</div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><section class="panel"><p><strong>Status:</strong> <span class="badge" th:text="${pedido.status.descricao}">Status</span></p><p><strong>Retirada:</strong> <span th:text="${pedido.codigoRetirada ?: 'Ainda não disponível'}">Código</span></p><div class="item-row" th:each="item : ${pedido.itens}"><span th:text="${item.quantidade + 'x ' + item.produto.nome}">Item</span><strong th:text="${'R$ ' + item.subtotal}">R$ 0,00</strong></div><p><strong>Total:</strong> <span th:text="${'R$ ' + pedido.valorTotal}">R$ 0,00</span></p><div class="actions"><form method="post" th:if="${pedido.status.name() == 'PAGO'}" th:action="@{/funcionario/pedido/{id}/preparar(id=${pedido.id})}"><button class="button" type="submit">Iniciar preparo</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form><form method="post" th:if="${pedido.status.name() == 'EM_PREPARO'}" th:action="@{/funcionario/pedido/{id}/pronto(id=${pedido.id})}"><button class="button" type="submit">Marcar como pronto</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form><form method="post" th:if="${pedido.status.name() == 'PRONTO'}" th:action="@{/funcionario/pedido/{id}/retirar(id=${pedido.id})}"><button class="button" type="submit">Confirmar retirada</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></div></section></main></body></html>
