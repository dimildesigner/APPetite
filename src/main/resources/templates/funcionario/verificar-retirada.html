<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Verificar retirada | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/funcionario}">APPetite / Operação</a><nav class="admin-nav"><a th:href="@{/funcionario}">Pedidos</a><a th:href="@{/funcionario/verificar}">Verificar retirada</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Atendimento</p><h1>Verificar retirada</h1></div></div><div class="flash error" th:if="${erro}" th:text="${erro}">Erro</div><form class="panel form-actions" method="get" th:action="@{/funcionario/verificar}"><label style="flex:1">Código de retirada<input name="codigo" th:value="${codigoInformado}" required></label><button class="button" type="submit">Buscar</button></form><section class="panel" th:if="${pedido}"><h2 th:text="${'Pedido #' + pedido.id + ' - ' + pedido.usuario.nome}">Pedido</h2><p>Pedido pronto para conferência.</p><form method="post" th:action="@{/funcionario/verificar/{id}/retirar(id=${pedido.id})}"><button class="button" type="submit">Confirmar retirada</button><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"></form></section></main></body></html>
