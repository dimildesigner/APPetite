<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Operação | APPetite</title><link rel="stylesheet" th:href="@{/css/admin.css}"></head><body><header class="admin-header"><a class="brand" th:href="@{/funcionario}">APPetite / Operação</a><nav class="admin-nav"><a th:href="@{/funcionario}">Pedidos</a><a th:href="@{/funcionario/verificar}">Verificar retirada</a><a th:href="@{/logout}">Sair</a></nav></header><main class="admin-main"><div class="page-heading"><div><p class="muted">Fila de atendimento</p><h1>Pedidos</h1></div></div><form class="filters" method="get" th:action="@{/funcionario}"><select name="status"><option value="">Todos os status</option><option th:each="item : ${statusList}" th:value="${item}" th:text="${item.descricao}" th:selected="${item == filtroStatus}">Status</option></select><select name="tipoPedido"><option value="">Todos os tipos</option><option th:each="item : ${tiposPedido}" th:value="${item}" th:text="${item.descricao}" th:selected="${item == filtroTipo}">Tipo</option></select><button class="button" type="submit">Filtrar</button></form><div class="table-wrap"><table><thead><tr><th>#</th><th>Cliente</th><th>Tipo</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="pedido : ${pedidos}"><td th:text="${pedido.id}">1</td><td th:text="${pedido.usuario.nome}">Cliente</td><td th:text="${pedido.tipoPedido.descricao}">Tipo</td><td th:text="${'R$ ' + pedido.valorTotal}">R$ 0,00</td><td><span class="badge" th:text="${pedido.status.descricao}">Status</span></td><td><a class="button secondary" th:href="@{/funcionario/pedido/{id}(id=${pedido.id})}">Detalhes</a></td></tr><tr th:if="${#lists.isEmpty(pedidos)}"><td colspan="6">Nenhum pedido encontrado.</td></tr></tbody></table></div></main></body></html>
